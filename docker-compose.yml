services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO:-}
      - ENABLE_GRAPH_RAG=${ENABLE_GRAPH_RAG:-false}
      - ENABLE_SUPERMEMORY=${ENABLE_SUPERMEMORY:-false}
      - SUPERMEMORY_URL=${SUPERMEMORY_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      # System 1 (Jev) — without these the container silently uses the local fallback.
      - S1_ENABLED=${S1_ENABLED:-true}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - JEV_BASE_URL=${JEV_BASE_URL:-https://api.typesafe.ai/v1}
      - JEV_MODEL=${JEV_MODEL:-jev-latest}
      - S1_CONFIDENCE_THRESHOLD=${S1_CONFIDENCE_THRESHOLD:-0.75}
    volumes:
      - cortex-data:/app/data
      - ./watch/feeds.local.yaml:/app/watch/feeds.local.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: ["python", "-m", "watch.scheduler"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SCHEDULE_INTERVAL_MINUTES=${SCHEDULE_INTERVAL_MINUTES:-240}
      - DIGEST_HOUR=${DIGEST_HOUR:-8}
      - DIGEST_MIN_SCORE=${DIGEST_MIN_SCORE:-6.0}
      - DIGEST_MAX_ITEMS=${DIGEST_MAX_ITEMS:-12}
      # The worker, not the API, is what delivers the daily digest.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - DIGEST_EMAIL_TO=${DIGEST_EMAIL_TO:-}
      # The ranker routes its scoring decisions through System 1 as well.
      - S1_ENABLED=${S1_ENABLED:-true}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - JEV_BASE_URL=${JEV_BASE_URL:-https://api.typesafe.ai/v1}
      - JEV_MODEL=${JEV_MODEL:-jev-latest}
      - S1_CONFIDENCE_THRESHOLD=${S1_CONFIDENCE_THRESHOLD:-0.75}
    volumes:
      - cortex-data:/app/data
      - ./watch/feeds.local.yaml:/app/watch/feeds.local.yaml:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      # The web server proxies /api/* to the engine (keeps the browser CORS-free).
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  cortex-data:
